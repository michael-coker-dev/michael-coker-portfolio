name: Live mobile navigation test

on:
  workflow_run:
    workflows: ["Deploy portfolio to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  mobile-menu:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test deployed mobile navigation
        run: node tests/mobile-menu.cjs
